services:
  - type: worker
    name: hookguard-delivery-worker
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: HOOKGUARD_SECRET_KEY
        sync: false
      - key: HOOKGUARD_PUBLIC_API_URL
        sync: false
      - key: DEMO_WEBHOOK_SECRET
        sync: false
      - key: DELIVERY_TIMEOUT_MS
        value: 3000
