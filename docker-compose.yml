services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hookguard
      POSTGRES_PASSWORD: hookguard
      POSTGRES_DB: hookguard
    ports:
      - "5432:5432"
    volumes:
      - hookguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookguard -d hookguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hookguard-postgres:
